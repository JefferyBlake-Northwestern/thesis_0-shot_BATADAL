# Frozen center point + model matrix + staged design (Ch.4 §4.3–§4.4).
# The center point is what every run inherits; freezing it keeps ~200 runs comparable.

experiment:
  window_hours: 24
  temperature: 0.0
  replicates: 3
  granularity: hourly

center_point:
  framing: domain                     # A: domain | neutral
  representation: raw                  # B: raw | raw_derived | derived_only
  reference: pure_zs                   # C: pure_zs | reference_augmented
  authenticity: [native, obfuscated]   # D: held as the control contrast at center

# model_string values to VERIFY against provider docs before going live.
models:
  - id: opus-5
    client: anthropic
    model_string: claude-opus-5
    role: performance anchor
  - id: opus-4.8
    client: anthropic
    model_string: claude-opus-4-8
    role: generation contrast vs opus-5
  - id: gemini-3.1-pro
    client: google                     # adapter is a stub until Google runs
    model_string: gemini-3.1-pro-preview
    role: cross-vendor flagship
  - id: gemini-3.6-flash
    client: google                     # adapter is a stub until Google runs
    model_string: gemini-3.6-flash
    role: cross-vendor flash
  - id: grok-4               
    client: xai             
    model_string: grok-4.6  
  - id: gpt-5.6-sol
    client: openai
    model_string: gpt-5.6-sol           
    role: cross-vendor flagship

stages:
  0:
    name: contamination_probe
    models: [opus-5]
    recognition_probe: true
    authenticity: [native, obfuscated]
  1:
    name: core_benchmark
    models: [opus-5, gpt-5.6-sol, grok-4]
    authenticity: [native, schema_preserved, obfuscated]
  2:
    name: framing_spoke
    models: [opus-5, opus-4.8, gemini-3.1-pro, gemini-3.6-flash]
    framing: [domain, neutral]
    authenticity: [native, obfuscated]
  3:
    name: representation_spoke
    models: [opus-5, gemini-3.1-pro, gemini-3.6-flash]
    representation: [raw_derived, derived_only]
    authenticity: [native, obfuscated]
  4:
    name: reference_spoke
    models: [opus-5, gemini-3.1-pro, gemini-3.6-flash]
    reference: [pure_zs, reference_augmented]
    authenticity: [native, obfuscated]
  9:
    name: schema_preserved_probe
    models: [opus-5]
    authenticity: [schema_preserved]

# Live-run inputs. Generate obfuscated_csv with: python -m harness.obfuscate ...
inputs:
  native_csv:     data/BATADAL_test_dataset.csv
  obfuscated_csv: data/BATADAL_test_dataset.correlational.csv
  schema_preserved_csv:  data/BATADAL_test_dataset.schema_preserved.csv
  labels:         data/BATADAL_test_attack_list.csv
